# ==============================================================================
# Production Profile Configuration (Active Host IP: 194.242.57.93)
# ==============================================================================

# Server Configuration
server.port=8080

# PostgreSQL Database Connection Details
spring.datasource.url=jdbc:postgresql://194.242.57.93:5001/fooddelivery01
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Observability & Monitoring: Grafana, Prometheus & Loki
# ==============================================================================

# Actuator & Prometheus Configuration
management.server.port=8083
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=food-delivery-backend
management.metrics.tags.environment=prod
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Loki Log Shipping Endpoint
loki.url=http://194.242.57.93:3100/loki/api/v1/push

# ==============================================================================
# Mailer / Portmailer Configuration
# ==============================================================================
spring.mail.host=194.242.57.93
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
